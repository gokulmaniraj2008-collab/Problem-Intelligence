<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Review — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,70px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar select,.toolbar input{padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit}.item{border-top:1px solid #e5e1d8;padding:20px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{border:1px solid #ccc;border-radius:99px;padding:5px 9px;font-size:12px}.title{font-size:20px;font-weight:900;margin:8px 0}.small{font-size:13px;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.metric{padding:12px;background:#f6f4ef;border-radius:10px}.btn{border:0;background:#171717;color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer}.status{margin-top:14px;padding:12px;border-radius:10px;background:#eef5e9}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Evidence Review</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">40 / EVIDENCE REVIEW</div><h1>Decide what<br><em>counts as proof.</em></h1><p>Review evidence one item at a time. Confirm only when the source and observation are credible enough to influence a decision.</p></section><section class="card"><div class="ey">REVIEW QUEUE</div><div class="toolbar"><input id="search" placeholder="Search evidence…"><select id="filter"><option value="all">All</option><option value="confirmed">Confirmed</option><option value="unconfirmed">Unconfirmed</option></select></div><div id="list" class="small">Loading evidence…</div></section></div><script>let items=[];const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/evidence');let d=await r.json();if(!r.ok)throw Error();items=Array.isArray(d)?d:(d.evidence||[]);render()}catch(e){$('list').innerHTML='<div class="status">Unable to load evidence. Check /api/evidence and Supabase configuration.</div>'}}function render(){let q=$('search').value.toLowerCase(),f=$('filter').value;let x=items.filter(e=>(e.notes||'').toLowerCase().includes(q)||(e.source_type||'').toLowerCase().includes(q)||(e.problem_title||'').toLowerCase().includes(q)).filter(e=>f==='all'||(f==='confirmed'?e.confirmed===true:e.confirmed!==true));$('list').innerHTML=x.length?x.map(e=>`<article class="item"><div class="meta"><span class="tag">${e.source_type||'Unknown source'}</span><span class="tag">${e.confirmed?'CONFIRMED':'UNCONFIRMED'}</span><span class="small">${e.created_at?new Date(e.created_at).toLocaleString():''}</span></div><div class="title">${e.problem_title||e.problem_id||'Problem evidence'}</div><p>${e.notes||'No observation recorded.'}</p><div class="grid"><div class="metric"><strong>Pain</strong><br>${e.pain_score??'—'}/10</div><div class="metric"><strong>Willingness to pay</strong><br>${e.willingness_to_pay??'—'}</div></div><button class="btn" style="margin-top:12px" onclick="review('${String(e.id||'').replace(/'/g,"\\'")}')">${e.confirmed?'Re-review':'Review evidence'}</button></article>`).join(''):'No matching evidence.'}async function review(id){if(!id)return alert('This evidence item has no server id, so it cannot be updated yet.');try{let r=await fetch('/api/evidence/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,confirmed:true})});if(!r.ok)throw Error();alert('Evidence confirmed.');load()}catch(e){alert('Review API is not connected. No data was changed.')}}$('search').oninput=render;$('filter').onchange=render;load();</script></body></html>
