<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opportunity Comparison — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:50px 0 30px}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:24px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.controls select,.btn{padding:12px;border-radius:10px;border:1px solid #ccc;font:inherit}.btn{background:#171717;color:#fff;font-weight:800;cursor:pointer}.table{overflow:auto}.grid{display:grid;grid-template-columns:1.6fr repeat(5,1fr);min-width:850px}.cell{padding:14px;border-top:1px solid #e5e1d8}.head{font-weight:800}.winner{background:#eef5e9}.score{font-size:26px;font-weight:900}.small{font-size:13px;color:#777}.bar{height:7px;background:#e5e1d8;border-radius:99px;overflow:hidden}.fill{height:100%;background:#171717}@media(max-width:700px){.wrap{padding:25px 15px}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Opportunity Comparison</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">15 / OPPORTUNITY COMPARISON</div><h1>Don't compare ideas.<br><em>Compare evidence.</em></h1><p>Choose up to five opportunities and compare the signals that matter: pain, business score, human proof, payment behavior and evidence strength.</p></section><section class="card"><div class="ey">SELECT OPPORTUNITIES</div><div id="controls" class="controls">Loading…</div><button class="btn" id="compare">Compare selected →</button><div id="output" style="margin-top:22px"></div></section></div><script>const $=id=>document.getElementById(id);let rows=[];async function init(){try{let r=await fetch('/api/ai-insights');if(!r.ok)throw Error();let d=await r.json();rows=d.top_opportunities||[];$('controls').innerHTML=[0,1,2,3,4].map((_,i)=>`<select id="s${i}"><option value="">Opportunity ${i+1}</option>${rows.map(p=>`<option value="${p.id}">${p.title}</option>`).join('')}</select>`).join('')}catch{$('controls').textContent='Unable to load opportunities.'}}$('compare').onclick=()=>{let ids=[0,1,2,3,4].map(i=>$('s'+i)?.value).filter(Boolean);let selected=ids.map(id=>rows.find(p=>String(p.id)===String(id))).filter(Boolean);if(!selected.length){$('output').innerHTML='<p class="small">Select at least one opportunity.</p>';return}let max=Math.max(...selected.map(p=>Number(p.final_score)||0));let html='<div class="table"><div class="grid"><div class="cell head">CRITERION</div>'+selected.map(p=>`<div class="cell head ${Number(p.final_score)===max?'winner':''}">${p.title}</div>`).join('')+'<div class="cell">Opportunity score</div>'+selected.map(p=>`<div class="cell ${Number(p.final_score)===max?'winner':''}"><span class="score">${p.final_score||0}</span>/100</div>`).join('')+'<div class="cell">Human evidence</div>'+selected.map(p=>`<div class="cell">${p.confirmed_count||0} confirmed</div>`).join('')+'<div class="cell">Payment signals</div>'+selected.map(p=>`<div class="cell">${p.pay_signals||0}</div>`).join('')+'<div class="cell">Pain</div>'+selected.map(p=>`<div class="cell">${p.avg_pain||0}/10</div>`).join('')+'<div class="cell">Category</div>'+selected.map(p=>`<div class="cell">${p.category||'Other'}</div>`).join('')+'<div class="cell">Evidence strength</div>'+selected.map(p=>{let e=Math.min(100,(Number(p.confirmed_count)||0)*12+(Number(p.pay_signals)||0)*18+(Number(p.avg_pain)||0)*5);return `<div class="cell"><strong>${Math.round(e)}/100</strong><div class="bar"><div class="fill" style="width:${e}%"></div></div></div>`}).join('')+'</div></div><p class="small" style="margin-top:18px">🏆 Highlighted opportunity has the highest current score. This is a prioritization aid, not a guarantee of success.</p>'; $('output').innerHTML=html};init();</script></body></html>
