<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Capture — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,70px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:25px}label{display:block;font-weight:800;margin:16px 0 7px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit;background:#fff}textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.check{display:flex;gap:10px;align-items:center;margin-top:16px}.check input{width:auto}.btn{margin-top:20px;border:0;background:#171717;color:#fff;padding:14px 18px;border-radius:10px;font-weight:900;cursor:pointer}.status{margin-top:15px;padding:12px;border-radius:10px;background:#eef5e9}.small{font-size:13px;color:#777}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Evidence Capture</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">22 / EVIDENCE CAPTURE</div><h1>Turn claims into<br><em>evidence.</em></h1><p>Record what a real person said, did, paid, or confirmed. AI can interpret the evidence later; the original observation stays intact.</p></section><section class="card"><form id="form"><label>Problem</label><select id="problem" required><option value="">Loading problems…</option></select><div class="grid"><div><label>Source type</label><select id="source_type"><option>Interview</option><option>Instagram</option><option>WhatsApp</option><option>Observation</option><option>Survey</option><option>Payment</option><option>Other</option></select></div><div><label>Persona</label><input id="persona" placeholder="Who experienced it?"></div></div><label>What did they actually say / do?</label><textarea id="notes" required placeholder="Capture the original observation, not your interpretation."></textarea><div class="grid"><div><label>Pain (0–10)</label><input id="pain_score" type="number" min="0" max="10" value="5"></div><div><label>Willingness to pay</label><input id="willingness_to_pay" type="number" min="0" step="1" value="0" placeholder="₹ amount or 0"></div></div><label class="check"><input id="confirmed" type="checkbox"> Person explicitly confirmed this is a real problem</label><button class="btn">Save evidence →</button><div id="status"></div></form></section></div><script>const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/problems');let d=await r.json();if(!r.ok)throw Error(d.error);$('problem').innerHTML=(d||[]).map(p=>`<option value="${p.id}">${p.title}</option>`).join('')||'<option value="">No problems yet</option>'}catch(e){$('problem').innerHTML='<option value="">Unable to load problems</option>'}}$('form').onsubmit=async e=>{e.preventDefault();let body={problem_id:$('problem').value,source_type:$('source_type').value,persona:$('persona').value,notes:$('notes').value,pain_score:Number($('pain_score').value),willingness_to_pay:Number($('willingness_to_pay').value),confirmed:$('confirmed').checked};if(!body.problem_id){$('status').innerHTML='<div class="status">Select a problem first.</div>';return}try{let r=await fetch('/api/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error);$('status').innerHTML='<div class="status">Evidence saved. It can now influence the opportunity score after review.</div>';$('notes').value='';}catch(err){$('status').innerHTML=`<div class="status">Could not save: ${err.message}</div>`}};load()</script></body></html>
