<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision Engine — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:24px}.decision{font-size:52px;font-weight:900;margin:12px 0}.green{color:#28733b}.amber{color:#8a6200}.red{color:#9b3028}.metric{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid #e5e1d8}.small{font-size:13px;color:#777}.item{border-top:1px solid #e5e1d8;padding:18px 0}.tag{display:inline-block;border:1px solid #ccc;border-radius:99px;padding:5px 9px;font-size:12px}select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit}.btn{margin-top:15px;border:0;background:#171717;color:#fff;padding:13px 16px;border-radius:10px;font-weight:900;cursor:pointer}.status{margin-top:14px;padding:12px;border-radius:10px;background:#eef5e9}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Decision Engine</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">28 / DECISION ENGINE</div><h1>Evidence in.<br><em>Decision out.</em></h1><p>A transparent founder decision layer. It combines opportunity strength with experiment outcomes and shows what still needs proof.</p></section><div class="grid"><section class="card"><div class="ey">OPPORTUNITY</div><select id="problem"><option>Loading…</option></select><div id="decision" class="decision">—</div><div id="score" class="small">—</div><div class="metric"><span>Human evidence</span><strong id="evidence">—</strong></div><div class="metric"><span>Payment signals</span><strong id="payment">—</strong></div><div class="metric"><span>Pain</span><strong id="pain">—</strong></div></section><section class="card"><div class="ey">REASONING</div><div id="reason" class="small">Loading decision evidence…</div><div id="signals"></div><button class="btn" onclick="saveDecision()">Record founder decision →</button><div id="status"></div></section></div></div><script>let rows=[],current;const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/ai-insights');let d=await r.json();if(!r.ok)throw Error();rows=d.top_opportunities||[];$('problem').innerHTML=rows.map((p,i)=>`<option value="${i}">${p.title}</option>`).join('')||'<option>No opportunities</option>';$('problem').onchange=render;render()}catch(e){$('reason').textContent='Unable to load intelligence data.'}}function render(){current=rows[Number($('problem').value)||0];if(!current)return;let s=Number(current.final_score||0),ev=Number(current.confirmed_count||0),pay=Number(current.pay_signals||0),pain=Number(current.avg_pain||0);let decision=s>=75?'BUILD':s>=45?'ITERATE':'RESEARCH';$('decision').textContent=decision;$('decision').className='decision '+(decision==='BUILD'?'green':decision==='ITERATE'?'amber':'red');$('score').textContent=`Opportunity score: ${s}/100`;$('evidence').textContent=ev;$('payment').textContent=pay;$('pain').textContent=pain+'/10';$('reason').innerHTML=`<strong>${decision}</strong> because the current opportunity score is ${s}/100. This is a heuristic decision, not proof of product-market fit.`;$('signals').innerHTML=[['Evidence',ev,`confirmed signals`],['Payment',pay,`payment signals`],['Pain',pain,`out of 10`]].map(x=>`<div class="item"><span class="tag">${x[0]}</span><div><strong>${x[1]}</strong> ${x[2]}</div><div class="small">Use independent experiments to strengthen this signal.</div></div>`).join('')}async function saveDecision(){if(!current)return;try{let r=await fetch('/api/decisions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({problem_id:current.id||current.problem_id,decision:$('decision').textContent,score:Number(current.final_score||0),reason:$('reason').textContent})});let d=await r.json();if(!r.ok)throw Error(d.error);$('status').innerHTML='<div class="status">Founder decision recorded with timestamp and score.</div>'}catch(e){$('status').innerHTML=`<div class="status">Could not save: ${e.message}</div>`}}load()</script></body></html>
