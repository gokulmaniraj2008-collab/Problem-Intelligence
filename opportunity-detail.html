<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opportunity Detail — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(40px,7vw,68px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:15px}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:24px;margin-bottom:15px}.score{font-size:55px;font-weight:900}.tag{display:inline-block;border:1px solid #ccc;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.metric{padding:13px 0;border-top:1px solid #e5e1d8}.small{font-size:13px;color:#777}.action{font-size:24px;font-weight:900;margin-top:8px}.item{border-top:1px solid #e5e1d8;padding:15px 0}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Opportunity Detail</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">35 / OPPORTUNITY DETAIL</div><h1>One opportunity.<br><em>Every signal.</em></h1><p>Deep-dive from the original problem through evidence, experiments, and the recommended next action.</p></section><div id="app">Loading opportunity…</div></div><script>const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/ai-insights');let d=await r.json();if(!r.ok)throw Error();let p=(d.top_opportunities||d.opportunities||[])[0];if(!p)throw Error();let score=Number(p.final_score||p.score||0),action=score>=75?'BUILD':score>=45?'VALIDATE':'RESEARCH';$('app').innerHTML=`<div class="grid"><main><section class="card"><span class="tag">PROBLEM</span><h2>${p.title||'Untitled opportunity'}</h2><p>${p.description||'No problem description available.'}</p><div class="metric"><strong>Persona</strong><br>${p.persona||p.who||'Not specified'}</div></section><section class="card"><div class="ey">EVIDENCE</div><div class="metric"><strong>Confirmed evidence</strong><br>${p.confirmed_count??p.evidence_count??0}</div><div class="metric"><strong>Pain</strong><br>${p.avg_pain??'—'} / 10</div><div class="metric"><strong>Payment signals</strong><br>${p.pay_signals??0}</div></section><section class="card"><div class="ey">EXPERIMENT / DECISION</div><div class="item"><strong>Experiment status</strong><br><span class="small">${p.experiment_status||'No experiment status available'}</span></div><div class="item"><strong>Current decision</strong><br><span class="small">${p.decision||'Not recorded'}</span></div></section></main><aside><section class="card"><div class="ey">OPPORTUNITY SCORE</div><div class="score">${score}</div><div class="small">/ 100</div><div class="metric"><strong>Recommended next action</strong><div class="action">${action}</div></div></section><section class="card"><div class="ey">WHY</div><p class="small">This recommendation is based on the available score and evidence fields. It is a decision aid, not a guarantee of market success.</p></section></aside></div>`}catch(e){$('app').innerHTML='<section class="card"><strong>Opportunity unavailable</strong><p class="small">Connect /api/ai-insights to show a live opportunity detail.</p></section>'}}load()</script></body></html>
