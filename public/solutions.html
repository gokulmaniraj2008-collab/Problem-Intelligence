<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problem Intelligence — Solutions</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f7f7f3;color:#171717}.wrap{max-width:1100px;margin:auto;padding:48px 20px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:#777}.hero{padding:40px 0}.hero h1{font-size:52px;line-height:1;margin:14px 0}.hero em{font-family:Georgia,serif;font-weight:400}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #ddd;border-radius:18px;padding:24px;box-shadow:0 8px 30px #00000008}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:10px;padding:12px;font:inherit}button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer;background:#171717;color:white;margin-top:16px}.problem{padding:14px;border:1px solid #e1e1e1;border-radius:12px;margin:10px 0;cursor:pointer}.problem:hover{background:#fafafa}.pill{display:inline-block;background:#eee;border-radius:999px;padding:5px 9px;font-size:11px}.score{font-size:28px;font-weight:800}.muted{color:#666}@media(max-width:750px){.grid{grid-template-columns:1fr}.hero h1{font-size:40px}}</style></head><body><div class="wrap"><div class="hero"><div class="eyebrow">05 / SOLUTION LAB</div><h1>Turn validated problems into<br><em>business options.</em></h1><p class="muted">Don't assume every problem needs an app. Compare software, AI, hardware, service and process solutions.</p></div><div class="grid"><section class="card"><div class="eyebrow">SELECT VALIDATED PROBLEM</div><select id="problem"><option value="">Loading problems…</option></select><div id="details" class="muted"></div></section><section class="card"><div class="eyebrow">CREATE SOLUTION</div><label>Name</label><input id="name" placeholder="e.g. AI enquiry assistant"><label>Description</label><textarea id="description" rows="3" placeholder="What exactly will solve the problem?"></textarea><label>Solution type</label><select id="type"><option>Software</option><option>AI</option><option>Hardware</option><option>Service</option><option>Process</option></select><label>Who pays?</label><input id="customer" placeholder="Customer / business / government"><label>Pricing idea</label><input id="pricing" placeholder="e.g. ₹499/month"><label>Competition / alternative</label><input id="competition" placeholder="What do they use today?"><label>Feasibility <span id="fv">5</span>/10</label><input id="feasibility" type="range" min="1" max="10" value="5"><button id="save">Save solution →</button><p id="msg" class="muted"></p></section></div><section class="card" style="margin-top:20px"><div class="eyebrow">SOLUTION SHORTLIST</div><div id="list" class="muted">Select a problem to see its solutions.</div></section></div><script>const $=id=>document.getElementById(id);let problems=[],solutions=[];async function load(){try{problems=await (await fetch('/api/problems')).json();$('problem').innerHTML='<option value="">Choose a problem</option>'+problems.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}catch(e){$('problem').innerHTML='<option>Unable to load problems</option>'}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function select(){const id=$('problem').value;if(!id){$('details').textContent='';$('list').textContent='Select a problem to see its solutions.';return}const p=problems.find(x=>x.id===id);$('details').innerHTML=`<h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><span class="pill">${esc(p.category||'Problem')}</span>`;try{solutions=await (await fetch('/api/solutions?problem_id='+encodeURIComponent(id))).json();render()}catch(e){$('list').textContent='Unable to load solutions.'}}function render(){if(!solutions.length){$('list').textContent='No solutions yet. Create the first option above.';return}$('list').innerHTML=solutions.map(s=>`<div class="problem"><span class="pill">${esc(s.solution_type)}</span><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><div class="score">${esc(s.pricing||'Pricing TBD')}</div><small class="muted">Customer: ${esc(s.customer||'TBD')} · Feasibility: ${esc(s.feasibility)}/10</small></div>`).join('')}$('problem').onchange=select;$('feasibility').oninput=e=>$('fv').textContent=e.target.value;$('save').onclick=async()=>{const problem_id=$('problem').value;if(!problem_id){$('msg').textContent='Select a problem first.';return}const body={problem_id,name:$('name').value,description:$('description').value,solution_type:$('type').value,customer:$('customer').value,pricing:$('pricing').value,competition:$('competition').value,feasibility:Number($('feasibility').value)};if(!body.name.trim()){ $('msg').textContent='Give the solution a name.';return}const r=await fetch('/api/solutions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){$('msg').textContent=d.error||'Could not save.';return}$('msg').textContent='✓ Solution saved to Supabase.';solutions.push(d);render()};load();</script></body></html>
