<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiment Dashboard — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:22px}.num{font-size:34px;font-weight:900}.small{font-size:13px;color:#777}.section{margin-top:18px}.item{border-top:1px solid #e5e1d8;padding:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{padding:13px;background:#f6f4ef;border-radius:10px}.status{display:inline-block;border:1px solid #ccc;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}.btn{border:0;background:#171717;color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:#171717;border:1px solid #ccc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Experiment Dashboard</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">26 / EXPERIMENT DASHBOARD</div><h1>Run the test.<br><em>Learn fast.</em></h1><p>Track experiments using real behavior, payments, and learning—not vanity metrics.</p></section><div class="stats"><div class="card"><div class="num" id="total">—</div><div class="small">experiments</div></div><div class="card"><div class="num" id="running">—</div><div class="small">running</div></div><div class="card"><div class="num" id="paid">—</div><div class="small">paid customers</div></div><div class="card"><div class="num" id="rate">—</div><div class="small">conversion</div></div></div><section class="card section"><div class="ey">EXPERIMENTS</div><div id="list" class="small">Loading…</div></section></div><script>let items=[];const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/experiments');let d=await r.json();if(!r.ok)throw Error(d.error);items=Array.isArray(d)?d:(d.experiments||[]);render()}catch(e){$('list').textContent='Unable to load experiments. Check /api/experiments and Supabase configuration.'}}function render(){let running=items.filter(x=>['planned','running','active'].includes(String(x.status).toLowerCase())).length;let participants=items.reduce((a,x)=>a+Number(x.tested_users||x.participants||0),0),paid=items.reduce((a,x)=>a+Number(x.paid_customers||0),0);$('total').textContent=items.length;$('running').textContent=running;$('paid').textContent=paid;$('rate').textContent=participants?Math.round(paid/participants*100)+'%':'—';$('list').innerHTML=items.length?items.map(x=>`<article class="item"><span class="status">${x.status||'planned'}</span><h2>${x.hypothesis||x.title||'Experiment'}</h2><div class="grid"><div class="metric"><strong>Target</strong><br>${x.target_users||'—'}</div><div class="metric"><strong>Success metric</strong><br>${x.success_metric||'—'}</div><div class="metric"><strong>Participants</strong><br>${x.tested_users||x.participants||0}</div><div class="metric"><strong>Paid</strong><br>${x.paid_customers||0}</div></div><div class="actions"><button class="btn" onclick="alert('Record participant behavior and payments through the experiment API.')">Record result</button><button class="btn alt" onclick="alert('Use the pass/fail criteria defined when this experiment was created.')">Evaluate</button></div></article>`).join(''):'No experiments yet. Create one from Experiment Builder.'}load()</script></body></html>
