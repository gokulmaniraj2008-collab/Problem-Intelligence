<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problem Portfolio — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:start}.col{background:#ebe9e2;border-radius:16px;padding:13px;min-height:260px}.col h3{margin:4px 0 14px}.count{font-size:12px;color:#777}.item{background:#fff;border:1px solid #ddd9d0;border-radius:12px;padding:13px;margin-bottom:9px}.title{font-weight:850;font-size:14px}.score{font-size:12px;color:#777;margin-top:8px}.small{font-size:13px;color:#777}.empty{color:#999;font-size:13px;padding:15px 3px}@media(max-width:900px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.board{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Problem Portfolio</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">34 / PROBLEM PORTFOLIO</div><h1>Manage the<br><em>whole pipeline.</em></h1><p>See where every opportunity sits—from early research to build, and which ones have been stopped.</p></section><section class="board" id="board"><div class="col"><h3>Research</h3><div class="empty">Loading…</div></div><div class="col"><h3>Validate</h3><div class="empty">Loading…</div></div><div class="col"><h3>Experiment</h3><div class="empty">Loading…</div></div><div class="col"><h3>Build</h3><div class="empty">Loading…</div></div><div class="col"><h3>Stop</h3><div class="empty">Loading…</div></div></section></div><script>const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/ai-insights');let d=await r.json();if(!r.ok)throw Error();let rows=d.top_opportunities||d.opportunities||[];let groups={research:[],validate:[],experiment:[],build:[],stop:[]};rows.forEach(x=>{let s=Number(x.final_score||x.score||0),dec=String(x.decision||'').toLowerCase();let k=dec==='stop'?'stop':dec==='build'||s>=75?'build':dec==='experiment'?'experiment':s>=45?'validate':'research';groups[k].push(x)});let labels={research:'Research',validate:'Validate',experiment:'Experiment',build:'Build',stop:'Stop'};$('board').innerHTML=Object.keys(groups).map(k=>`<section class="col"><h3>${labels[k]} <span class="count">${groups[k].length}</span></h3>${groups[k].map(x=>`<article class="item"><div class="title">${x.title||'Untitled opportunity'}</div><div class="score">Score: ${x.final_score??x.score??'—'} / 100</div></article>`).join('')||'<div class="empty">No opportunities</div>'}</section>`).join('')}catch(e){$('board').innerHTML='<div class="col" style="grid-column:1/-1"><strong>Portfolio unavailable</strong><p class="small">Connect /api/ai-insights to populate the live portfolio.</p></div>'}}load()</script></body></html>
