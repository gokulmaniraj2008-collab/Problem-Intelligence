<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross-Problem Signals — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,70px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:24px}.signal{border-top:1px solid #e5e1d8;padding:20px 0}.tag{display:inline-block;border:1px solid #ccc;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.count{font-size:30px;font-weight:900}.small{font-size:13px;color:#777}.bar{height:8px;background:#e5e1d8;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#171717}@media(max-width:700px){.hero h1{font-size:46px}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Cross-Problem Signals</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">32 / CROSS-PROBLEM SIGNALS</div><h1>Find signals that<br><em>repeat.</em></h1><p>Look across the problem set for recurring pain, payment, evidence, and workaround language. Repetition is a signal to investigate—not proof of a market.</p></section><section class="card"><div class="ey">REPEATED SIGNALS</div><div id="list">Loading…</div></section></div><script>let rows=[];const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/problems');let d=await r.json();if(!r.ok)throw Error(d.error);rows=Array.isArray(d)?d:(d.problems||[]);render()}catch(e){$('list').innerHTML='<p class="small">Unable to load problems. Check /api/problems and Supabase configuration.</p>'}}function render(){let buckets=[['High pain','pain_score',x=>Number(x.pain_score)>=7],['Payment signal','willingness_to_pay',x=>Number(x.willingness_to_pay)>0],['Frequent problem','frequency',x=>/daily|weekly|often|frequent/i.test(String(x.frequency||''))],['Existing workaround','workaround',x=>String(x.workaround||x.current_solution||'').trim().length>10],['Confirmed evidence','evidence',x=>Number(x.confirmed_count||x.evidence_count||0)>0]];let out=buckets.map(([name,key,test])=>{let hits=rows.filter(test),pct=rows.length?Math.round(hits.length/rows.length*100):0;return `<article class="signal"><span class="tag">SIGNAL</span><h2>${name}</h2><div class="count">${hits.length} <span class="small">of ${rows.length} problems</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><p class="small">${pct}% of the current dataset shows this signal. Inspect the underlying problems before treating it as a trend.</p></article>`}).join('');$('list').innerHTML=out||'No problems found.'}load()</script></body></html>
