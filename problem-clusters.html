<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problem Clusters — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar input{padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit}.cluster{border-top:1px solid #e5e1d8;padding:20px 0}.cluster h2{margin:7px 0}.tag{display:inline-block;border:1px solid #ccc;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.problem{padding:11px 0;border-top:1px solid #eee}.small{font-size:13px;color:#777}.count{font-size:30px;font-weight:900}@media(max-width:700px){.hero h1{font-size:46px}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Problem Clusters</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">31 / PROBLEM CLUSTERS</div><h1>Find the pattern<br><em>under the noise.</em></h1><p>Group similar problems by shared language and signals. Clustering is a discovery aid; a human must confirm that two problems are genuinely related.</p></section><section class="card"><div class="ey">CLUSTER VIEW</div><div class="toolbar"><input id="q" placeholder="Search problems or themes…"><span class="small" id="meta">Loading…</span></div><div id="list">Loading clusters…</div></section></div><script>let problems=[];const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/problems');let d=await r.json();if(!r.ok)throw Error(d.error);problems=Array.isArray(d)?d:(d.problems||[]);render()}catch(e){$('list').innerHTML='<p class="small">Unable to load problems. Check /api/problems and Supabase configuration.</p>'}}function key(p){let text=((p.category||p.theme||'Uncategorized')+' '+(p.persona||p.who||'')).toLowerCase();if(text.includes('health'))return'Health & wellbeing';if(text.includes('agri')||text.includes('farm'))return'Agriculture & food';if(text.includes('education')||text.includes('student'))return'Education';if(text.includes('transport')||text.includes('logistics'))return'Mobility & logistics';if(text.includes('finance')||text.includes('payment'))return'Finance';if(text.includes('climate')||text.includes('energy'))return'Climate & energy';return p.category||p.theme||'General problems'}function render(){let q=$('q').value.toLowerCase(),groups={};problems.filter(p=>((p.title||'')+' '+(p.description||'')+' '+key(p)).toLowerCase().includes(q)).forEach(p=>{let k=key(p);(groups[k]??=[]).push(p)});let entries=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);$('meta').textContent=problems.length+' problems · '+entries.length+' clusters';$('list').innerHTML=entries.length?entries.map(([k,x])=>`<article class="cluster"><span class="tag">CLUSTER</span><h2>${k}</h2><div class="count">${x.length} <span class="small">problems</span></div>${x.slice(0,8).map(p=>`<div class="problem"><strong>${p.title||'Untitled problem'}</strong><div class="small">${p.persona||p.who||'Persona not specified'}</div></div>`).join('')}${x.length>8?`<div class="small">+ ${x.length-8} more in this cluster</div>`:''}</article>`).join(''):'No matching problems.'}$('q').oninput=render}load()</script></body></html>
