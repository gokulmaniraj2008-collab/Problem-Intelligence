<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opportunity Radar — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:20px}.num{font-size:35px;font-weight:900}.toolbar{margin:18px 0;display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid #ccc;border-radius:10px;font:inherit}.item{border-top:1px solid #e5e1d8;padding:18px 0;display:grid;grid-template-columns:70px 1fr 110px;gap:15px;align-items:center}.rank{font-size:25px;font-weight:900}.title{font-size:18px;font-weight:900}.tag{display:inline-block;border:1px solid #ccc;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900}.score{font-size:25px;font-weight:900;text-align:right}.small{font-size:13px;color:#777}.signals{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:45px 1fr}.score{grid-column:2;text-align:left}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Opportunity Radar</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">30 / OPPORTUNITY RADAR</div><h1>Where should you<br><em>build next?</em></h1><p>Rank opportunities using evidence, score, and experiment signals. This is a decision aid—not a promise of market success.</p></section><div class="stats"><div class="card"><div class="num" id="all">—</div><div class="small">opportunities</div></div><div class="card"><div class="num" id="build">—</div><div class="small">build candidates</div></div><div class="card"><div class="num" id="validate">—</div><div class="small">validate more</div></div><div class="card"><div class="num" id="research">—</div><div class="small">research</div></div></div><section class="card" style="margin-top:18px"><div class="ey">RANKED RADAR</div><div class="toolbar"><input id="q" placeholder="Search opportunities…"><select id="band"><option value="all">All decisions</option><option value="build">BUILD</option><option value="validate">VALIDATE</option><option value="research">RESEARCH</option><option value="stop">STOP</option></select></div><div id="list" class="small">Loading radar…</div></section></div><script>let rows=[];const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/ai-insights');let d=await r.json();if(!r.ok)throw Error(d.error);rows=d.top_opportunities||d.opportunities||[];render()}catch(e){$('list').innerHTML='<div style="padding:20px 0">Unable to load the live opportunity radar. Check /api/ai-insights and Supabase configuration.</div>'}}function decision(x){let s=Number(x.final_score||x.score||0);if(String(x.decision||'').toLowerCase()==='stop')return'STOP';if(s>=75)return'BUILD';if(s>=45)return'VALIDATE';return'RESEARCH'}function render(){let counts={BUILD:0,VALIDATE:0,RESEARCH:0,STOP:0};rows.forEach(x=>counts[decision(x)]++);$('all').textContent=rows.length;$('build').textContent=counts.BUILD;$('validate').textContent=counts.VALIDATE;$('research').textContent=counts.RESEARCH;let q=$('q').value.toLowerCase(),b=$('band').value;let x=rows.map((v,i)=>({...v,_d:decision(v),_i:i})).filter(v=>(v.title||'').toLowerCase().includes(q)).filter(v=>b==='all'||v._d.toLowerCase()===b);$('list').innerHTML=x.map(v=>`<article class="item"><div class="rank">#${v._i+1}</div><div><div class="tag">${v._d}</div><div class="title">${v.title||'Untitled opportunity'}</div><div class="signals"><span class="small">Evidence: ${v.confirmed_count??0}</span><span class="small">Pain: ${v.avg_pain??'—'}/10</span><span class="small">Payment: ${v.pay_signals??0}</span></div></div><div class="score">${v.final_score??v.score??'—'}<div class="small">/100</div></div></article>`).join('')||'No matching opportunities.'}$('q').oninput=render;$('band').onchange=render}load()</script></body></html>
