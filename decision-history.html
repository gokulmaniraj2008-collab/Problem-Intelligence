<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision History — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,70px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.card{background:#fff;border:1px solid #dedbd3;border-radius:20px;padding:24px}.item{border-top:1px solid #e5e1d8;padding:20px 0}.tag{display:inline-block;border:1px solid #ccc;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}.small{font-size:13px;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.metric{padding:12px;background:#f6f4ef;border-radius:10px}.timeline{border-left:2px solid #ddd;padding-left:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Decision History</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">29 / DECISION HISTORY</div><h1>Every decision.<br><em>Every reason.</em></h1><p>A transparent history of how evidence and experiments changed the founder's decision.</p></section><section class="card"><div class="ey">AUDIT TIMELINE</div><div id="list" class="timeline small">Loading decision history…</div></section></div><script>const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/decisions');let d=await r.json();if(!r.ok)throw Error(d.error);let x=Array.isArray(d)?d:(d.decisions||[]);$('list').innerHTML=x.length?x.map(v=>`<article class="item"><span class="tag">${v.decision||v.action||'DECISION'}</span><h2>${v.problem_title||v.title||v.problem_id||'Opportunity'}</h2><div class="grid"><div class="metric"><strong>Score</strong><br>${v.score??v.final_score??'—'}</div><div class="metric"><strong>Date</strong><br>${v.created_at?new Date(v.created_at).toLocaleString():'—'}</div></div><p>${v.reason||v.rationale||v.notes||'No rationale recorded.'}</p><div class="small">Source: ${v.source||'Founder / decision engine'}</div></article>`).join(''):'No decisions recorded yet.'}catch(e){$('list').innerHTML='<div style="padding:20px 0">Decision history API is not available yet. Once /api/decisions is connected, this page will show the full audit trail.</div>'}}load()</script></body></html>
