<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Founder Action Board — Problem Intelligence</title><style>body{margin:0;background:#f6f4ef;color:#171717;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1150px;margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between}.back{color:#111;text-decoration:none;font-weight:700}.ey{font-size:12px;letter-spacing:.16em;font-weight:800;color:#777}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.94;margin:10px 0}.hero em{font-family:Georgia,serif;font-weight:400}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.col{background:#ebe9e2;border-radius:16px;padding:15px;min-height:280px}.col h3{margin:3px 0 15px}.task{background:#fff;border:1px solid #ddd9d0;border-radius:12px;padding:14px;margin-bottom:10px}.task strong{display:block}.meta{font-size:12px;color:#777;margin-top:8px}.tag{display:inline-block;border:1px solid #ccc;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:900}.empty{font-size:13px;color:#999;padding:15px 2px}@media(max-width:850px){.board{grid-template-columns:1fr 1fr}}@media(max-width:600px){.board{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><strong>PI / Founder Action Board</strong><a class="back" href="/">← Back</a></div><section class="hero"><div class="ey">37 / FOUNDER ACTION BOARD</div><h1>Turn decisions<br>into <em>action.</em></h1><p>A lightweight execution board for the work required to validate, experiment, build, or stop an opportunity.</p></section><section class="board" id="board"><div class="col"><h3>Next</h3><div class="empty">Loading…</div></div><div class="col"><h3>In progress</h3><div class="empty">Loading…</div></div><div class="col"><h3>Done</h3><div class="empty">Loading…</div></div></section></div><script>const $=id=>document.getElementById(id);async function load(){try{let r=await fetch('/api/ai-insights');if(!r.ok)throw Error();let d=await r.json(),rows=d.top_opportunities||[];let next=rows.slice(0,5),progress=rows.filter(x=>String(x.experiment_status||'').toLowerCase().includes('progress')).slice(0,5);let done=rows.filter(x=>String(x.decision||'').toLowerCase()==='build').slice(0,5);let groups=[['Next',next,'Define the smallest validation test'],['In progress',progress,'Run or complete the current experiment'],['Done',done,'Decision reached: build candidate']];$('board').innerHTML=groups.map(([name,list,defaultText])=>`<section class="col"><h3>${name} <span class="meta">${list.length}</span></h3>${list.map(x=>`<article class="task"><span class="tag">${x.category||'OPPORTUNITY'}</span><strong>${x.title||'Untitled opportunity'}</strong><div class="meta">${defaultText} · Score ${x.final_score??x.score??'—'}/100</div></article>`).join('')||'<div class="empty">No live tasks in this stage.</div>'}</section>`).join('')}catch(e){$('board').innerHTML='<div class="col" style="grid-column:1/-1"><strong>Action board unavailable</strong><div class="empty">Connect /api/ai-insights to generate actions from live opportunity data.</div></div>'}}load()</script></body></html>
